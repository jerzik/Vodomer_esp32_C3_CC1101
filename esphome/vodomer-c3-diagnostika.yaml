# Diagnostika: bez handlerů konkrétních měřidel, sběr FRAME a RSSI.
# Zachovává název zařízení vodomer-c3. Po testu vrať produkční firmware.
# ESPHome firmware: jeden přijímač pro studenou i teplou vodu.
# Soubor patří do ESPHome Device Builder, nikoli configuration.yaml HA.
substitutions:
  diagnostic_note: "Pouze hledani ramcu; bez dekodovani spotreby"

esphome:
  name: vodomer-c3
  friendly_name: Vodomer C3
  min_version: 2026.9.1

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret vodomer_api_key
  reboot_timeout: 0s

# Nutné i pro kompilaci externí komponenty (real_time_clock.h).
time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Prague

ota:
  - platform: esphome
    password: !secret vodomer_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  reboot_timeout: 0s

# Připnutá revize namísto průběžně se měnící větve main.
external_components:
  - source: github://SzczepanLeon/esphome-components@381afe89f39f8a7aaaae6330f214d3b4f59785b1
    components: [wmbus_radio, wmbus_common, wmbus_meter]
    refresh: never

wmbus_common:
  drivers: [apator162]

spi:
  clk_pin: GPIO5
  mosi_pin: GPIO6
  miso_pin: GPIO7

wmbus_radio:
  radio_type: CC1101
  cs_pin: GPIO4
  irq_pin: GPIO3
  frequency: 868.95MHz
  on_frame:
    - then:
        - logger.log:
            format: "WMBUS RSSI=%ddBm FRAME=%s"
            args: ['frame->rssi()', 'frame->as_hex().c_str()']

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Stav prijimace"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart prijimace"
    entity_category: diagnostic
