    state_class: measurement
    entity_category: diagnostic

  - platform: template
    id: obyvak_pocet
    name: "EITN ${heat_obyvak_id} pocet"
    unit_of_measurement: "zprav"
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: obyvak_stari
